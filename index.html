。\n\n第二段｜黑场·历史扑面而来\n\n【舞台】突然全黑。下一秒，强烈的转场音效响起。游行队伍从上下场口快速、密集地穿过舞台，只做视觉冲\n\n击，不停留、不展开完整游行。\n\n【音乐/音效】强烈脚步声＋群体口号＋短促冲击音；以非写实的低频冲击制造时代突然扑面的感觉。\n\n【舞台】队伍经过时，有人紧握旗杆，有人回头，有人神情坚决，有人边跑边高喊，有人抱着写满字的纸张；\n\n每个人都像刚刚从历史里冲出来。\n\n【舞台】现代学生被人流带得后退一步，茫然、震撼，手还停在刚刚合上的书上。队伍迅速消失。舞台重新安\n\n静。\n\n第三段｜背景幕挑字·1919／北京大学／北大红楼\n\n【PPT/背景】黑幕后或背景幕逐层出现：1919 年 → 北京 → 北京大学 → 北大红楼。最后“北大红楼”定格。\n\n【灯光】最后一个字亮起，灯光打开，红楼场景正式出现。\n\n【音乐/音效】翻书声淡出，进入低强度历史氛围底。推荐参考《觉醒年代》“校园”或“局势”一类纯音乐\n\n氛围。\n\n第四段｜红楼·人物依次登场\n\n旁白只负责报名字、给身份，每人一句，约七至十字。念到谁，谁从暗处进入；进入后立刻带动作：读报、翻\n\n书、写字、整理纸张、低声交谈。\n\n旁白（报身份）：北大校长——蔡元培。\n\n旁白（报身份）：革命先驱——李大钊。\n\n旁白（报身份）：新文化先锋——陈独秀。\n\n旁白（报身份）：文学巨匠——鲁迅。\n\n旁白（报身份）：新潮社人——钱玄同。\n\n旁白（报身份）：新文化人——刘半农。\n\n旁白（报身份）：学生代表——罗家伦。\n\n旁白（报身份）：学生代表——傅斯年。\n\n【舞台】人物全部进入后，不立刻说话，先形成“红楼正在运转”的生活状态。\n\n第五段｜巴黎和会的消息传入\n\n【舞台】一切保持日常状态。现代学生站在人流中，一脸茫然。\n\n现代学生：不对，这什么地方？\n\n学生乙：哎，这位小同学，你应该不是北大的学生吧？\n\n现代学生：这，这是北大？\n\n学生乙：你这身校服我从未见过，你是哪所学校的？ 哎，你这校徽，这种字体我也没见过。\n\n现代学生：我是，呃，我…\n\n【舞台】突然，学生甲拿着一份报纸快步进来，神色急促。现代学生慢慢被挤到人群后。\n\n学生甲（压低声音、喘息）：巴黎那边……消息到了。\n\n学生乙（快步上前）：什么消息？\n\n学生甲（把报纸摊开）：巴黎和会决定，德国在山东的权益……转给日本。\n\n【舞台】四周动作慢慢停下。报纸从学生甲手中传到学生乙、学生丙、罗家伦，再传到其他人。\n\n学生丙（难以置信）：可我们是战胜国。\n\n罗家伦（压住怒意）：战胜国，连自己的土地都守不住，这算什么战胜国？\n\n傅斯年（盯着报纸，一字一句）：一旦他们在巴黎的桌上落笔，我们的山河就要少一寸。\n\n李大钊（抬头环视众人）：诸位，消息既然已经传过来，我们就必须做出点行动来。\n\n【舞台】低声议论从四周慢慢起来，像一滴水落进整池水面。\n\n【音乐/音效】报纸翻动、纸张摩擦声放大；底乐开始缓慢增强。\n\n第六段｜红楼·争论\n\n【舞台】众人围着一张桌子展开讨论。有人喝水、有人翻报纸、有人写字。桌面成为所有人争论的中心。\n\n以下台词均为本剧原创工作台词，不直接使用历史人物原话；重点保留时代气息、文学感和青年人的锋芒。\n\n陈独秀（猛然抬头，压着怒火）：耻辱，赤裸裸的耻辱！全中国四万万同胞绝不会接受这种结果。\n\n鲁迅（冷静、沉着）：这铁屋确是愈加牢固了。但希望总归是有的，单是北平城就已有了无数觉醒的人。\n\n钱玄同（向众人靠近一步）：豫才说得对，应该集合起我们的青年们做些什么。\n\n刘半农（指向报纸）：必须争出一个结果。一张纸上的字，看起来很轻，可如果它背后藏着一个国家的命运，\n\n谁又能说清这字的分量。\n\n罗家伦（拍一下桌面后克制住）：连洋人都能替我们决定山东，我们还要忍耐到什么时候？连一句“不”都不\n\n敢说，又何谈未来？\n\n傅斯年（起身、声音加重）：我们今天争的，绝不只是一纸签字。我们要争我们的未来，争四万万同胞的未来。\n\n学生甲（脱口而出）：决不能签！\n\n学生乙（紧接着）：对，不能为屈辱签字。\n\n学生丙（情绪上涌）：也不能让这件事只留在报纸上。我们得闹大一些，让全世界听得见国人的呐喊。\n\n学生甲（犹豫、压低声音）：可如果闹大了，出了事情谁来担责？国家以后还需要我们这些青年……\n\n学生丙（向前一步）：如果不这样做，国家哪还有以后！\n\n【音乐/音效】推荐从《觉醒年代》“局势”进入争论中段，争论后半段逐步推高；也可用原创管弦乐替代。\n\n第七段｜锤击·“安静”\n\n【舞台】争论越来越快。几个人同时说话，声音叠在一起。\n\n【舞台】蔡元培从人群中走向中央，拿起锤子，重重敲下。\n\n【音乐/音效】锤击“砰”一声，音乐瞬间切断。\n\n蔡元培（沉稳、短促）：安静。\n\n【舞台】全场静止。建议停 2—3 秒，只留下呼吸声。所有人的视线集中到中央。\n\n第八段｜思想爆发·青年站出来\n\n蔡元培（缓慢扫视众人）：既然已身在这里，便也无需争论了，答案是显然的。\n\n【舞台】李大钊向前一步。随后陈独秀、鲁迅等各自只说一句。台词逐渐由个人转向青年。\n\n李大钊（向前一步，目光坚定）：时代不会等候旁观者。青年身在其中，就不能把责任只当成课本里的内容。\n\n陈独秀（直视台下）：国事已经到了门口，谁还愿意只做看客？\n\n鲁迅（平静却有力量）：真正的觉醒未必是看见黑暗；恰恰相反，已身处黑暗，却还愿做唯一的光，这是真正\n\n的觉醒。\n\n陈独秀（声音提高）：面对责任，绝不能向后退，青年应该站出来，有思想有灵魂的人都应该站出来。\n\n【舞台】学生甲先站出。\n\n学生甲（握紧拳头）：我站出来！\n\n【舞台】学生乙紧接。\n\n学生乙（向前一步）：我也站出来。\n\n【舞台】学生丙向中央靠拢。\n\n学生丙（坚定）：算我一个。\n\n【舞台】更多学生从桌边、后方逐渐向中央靠拢。\n\n学生群体（由少到多）：我来…我也来…一起…\n\n【音乐/音效】推荐《觉醒年代》“为了觉醒”或“年少的希望”一类舒缓至渐强的纯音乐。\n\n第九段｜最终大站位·北大红楼群像\n\n【舞台】所有主要人物停止动作，形成最终群像。建议只用一张桌子、一把椅子完成构图。\n\n具体站位：后排中央蔡元培；后排左陈独秀；后排右李大钊；中排左鲁迅；中后两侧钱玄同、刘半农；前排左罗家伦；前\n\n排右傅斯年；最前方及桌前两侧学生甲、学生乙、学生丙及其他学生。现代学生最后停在最外侧，既像旁观者，又像已经\n\n进入这段历史。\n\n【舞台】桌子放舞台中央偏后；蔡元培站在桌后中央或桌旁；椅子可留在桌旁，作为鲁迅等人物短暂落座的调\n\n度点，不要求频繁移动。\n\n【舞台】群像形成后先不喊，保持 5—8 秒。音乐进入舒缓段，让观众看清人物关系。\n\n第十段｜群像之后·保守与激进的分歧\n\n【舞台】音乐由舒缓逐渐变重。部分学生从群像中向两侧退半步，形成自然分化。\n\n保守方学生（克制、带担忧）：你们说得痛快，可改变一个国家，哪有这样容易？\n\n激进方学生（向前半步）：这条路一定艰难，但这绝非我们坐以待毙的理由。\n\n保守方学生（与对方对视）：理想写在纸上容易，真要走出去呢？你们没想过后果？\n\n激进方学生（停顿后回答）：至少，我们不能连站起来的勇气都没有。\n\n【舞台】双方不必大吵，以对视、向前一步、再停住制造张力。\n\n第十一段｜音乐骤停·“那就等着看”\n\n【舞台】音乐越来越强，双方几乎同时开口。突然——音乐全部停。\n\n【舞台】激进派最靠前的青年向前半步，面向对方，也面向观众。\n\n激进青年（停顿后，一字一句）：那就等着看。看这个旧世界，怎么把路让给新的青年。\n\n【舞台】停顿一拍。\n\n激进青年（坚定、直视观众）：新中国要等的，不正是我们青年吗？\n\n第十二段｜B 场前·黑场与旁白\n\n【舞台】所有人保持最后的群像站位。灯光慢慢收束，黑幕。\n\n旁白（深沉悠远）：从巴黎和会的消息传来，到全体青年站在一起，一场更深的觉醒，已经悄然开始。\n\n旁白（声音延续）：北大红楼的这一夜，并没有随着灯光熄灭而结束。\n\n旁白（最后一句落在黑场里）：历史，还在继续。\n\n【舞台】黑场，进入 Part 2。黑幕不要立刻完全打开，以保留上一段口号与呼吸的余震。\n\nPART 2｜青年集结与爱国运动\n工作估算时长：约 10—12 分钟｜本段统一采用 Part 1 的现场工作格式。共七场，每场明确【舞台】【音乐】\n【PPT】【灯光】【舞美】；演员动作、表情、停顿直接写入台词后的括号。\n\n第一场｜雨夜惊讯·红楼夜会\n【舞台】黑幕打开。深夜的北大红楼内景。空间局促、灯光昏暗，所有人已经在各自的位置上忙碌，没有人第\n一时间说话。\n【PPT】P04“北大红楼内景”继续使用；画面偏暗、静止，不做明显动画，只承担空间延伸。\n【灯光】L12 起始状态：中低位暗光，人物可见但不过亮；桌边区域略亮，李大钊、鲁迅暂不抢视觉中心。\n\n【舞美】仅使用 1 张课桌、1 把椅子；桌面准备报纸、纸张、铅笔、书籍。后台在开场前完成所有道具就位。\n\n【音乐】M14：《觉醒年代》“黑暗”类氛围或同类低沉历史弦乐；先压低铺底，人物动作声（纸张、笔触）必\n须清楚。\n学生甲：坐在桌旁，低头整理刚刚传来的报纸，把报纸一张张摊开、折好，又重新翻看重点内容。（神情凝\n重，偶尔停下思考）\n\n学生乙：站在桌边，用铅笔在纸上快速记录，写下几个关键词，又划掉重写。（写得很急，但始终保持安静）\n\n学生丙：靠在一侧翻阅书籍，翻到某一页后停住，久久没有继续。（抬头望向周围，欲言又止）\n\n罗家伦：站在稍远处整理散落的传单和纸张，将已经写好的内容叠放整齐。（动作克制，神情坚定）\n\n傅斯年：独自站在一侧，望向窗外夜色。（沉默片刻后低头攥紧手中的纸）\n\n匡互生：从后台快速进入，手中拿着新的消息或纸张，走到众人之间，却没有马上开口。（环顾四周，似乎在\n等一个合适的时机）\n\n邓中夏：在一旁默默观察众人，随后走到学生甲身边，低声确认手中的材料。（点头，示意继续准备）\n\n谢绍敏：坐在桌旁快速写字，写完后停笔，抬头看向众人。（神情越来越坚定）\n\n李大钊：站在后方或侧面，暂时不参与交谈，只观察所有青年。（沉默、深思）\n\n鲁迅：独自坐或站在一侧，手中拿着书或纸张，偶尔翻动一页。（目光沉静，似乎在思考什么）\n\n【舞台】整个空间始终保持安静，每个人都在做自己的事情。没有人真正放松，但也没有人后退。空气里像是\n压着一件所有人都知道、却还没有说出口的事情。\n【音乐】音乐逐渐减弱，为第一句台词留出空间。\n学生甲（终于抬头，看向众人）：大家……都还没走？\n\n学生乙（停下笔）：这种时候，谁还走得了？\n\n【停顿】众人短暂对视。\n\n【舞台】所有人的动作逐渐停下，视线开始汇聚。\n【灯光】由分散暗光缓慢收向人物群体中央，为下一场“法科礼堂”做集中光区准备。\n\n【音乐】M14 尾音收掉，M15 准备进入；音乐不要抢转场。\n【Cue】下一场不是换一个“新节目”，而是把刚才压抑的气氛继续推进到公开的集会现场。\n\n第二场｜真理的辩论·巴黎死局\n【舞台】空间切换为北大法科礼堂。演员快速调整站位：学生群体形成静坐/站立的大会状态，邵飘萍置于中\n央；无需实际摆出两张长桌，继续沿用轻装舞台。\n【PPT】P05“巴黎和会／山东”历史画面；以旧报纸、山东地图、外交文本质感为主，保持压抑。\n【灯光】L12 进入中低位光，追光或窄面光锁住邵飘萍；其余学生保持半暗，形成“消息从中央炸开”的视觉关\n系。\n\n【舞美】保留 1 张桌子作为讲台/临时主席台；雨声由音效完成，不增加实体布景。\n\n【音乐】M15：《觉醒年代》“黑暗”或同类低沉管弦；邵飘萍第一句前压低，关键反驳时再逐层加压。\n邵飘萍（肃立台前，手持最新外交快讯，声音沉而锋利）：同学们！今日午后，汪大燮先生密告蔡元培校长\n——巴黎和会已定死局！\n\n邵飘萍：列强公然背弃公理，将德国在山东一切权益，全数转交日本！我中国作为一战战胜国，未得寸土之\n荣，反失千里河山！更可恨者，北洋政府软弱屈膝，已然默许签约，准备咽下这千古奇辱！\n\n【舞台】全场轰然一震。学生们神色有悲愤，有惊讶，有不屑；低语迅速从中央向两侧扩散。\n\n保守派学生（声音颤抖、忧心忡忡）：可我们只是学子！手无权、无兵、无势！政府懦弱、列强强权，我们发\n声，不过是以卵击石！一旦过激，必会招致军警镇压，连累北大、连累所有同窗！难道……我们只能认命吗？\n\n邓中夏（起身沉稳开口，压下骚动）：认命？国家山河寸寸被割，民族尊严扫地殆尽，我辈青年若再认命、再\n沉默，他日史书一笔，便是“五四青年，坐视国亡”！\n\n邓中夏：今日不是我们要不要闹事，是家国已经到了不奋起、便沉沦的绝境！\n\n匡互生（攥拳挺身，满眼怒火）：所谓公理、所谓正义，从来求不来、盼不来！是列强用来愚弄弱国的空话！\n\n匡互生：山东是齐鲁故土，是华夏文脉之源！绝不能拱手让人！\n\n【舞台】全场情绪沸腾，众人悲愤难抑，气氛推向临界点。\n【灯光】随着反驳逐步收窄光区，邓中夏、匡互生和学生群体形成三个层次，不要使用花哨颜色。\n\n【音乐】M15 保持低位；进入血书段前压到最低，让台词和动作成为唯一焦点。\n谢绍敏（猛然跨步上前，双目赤红，字字泣血）：国家危难至此，我辈读书人，岂能袖手旁观！\n\n【舞美】谢绍敏使用安全的红色墨水／红色布条完成“血书”视觉，不安排咬破手指等危险动作；后台提前把材\n料放在桌边可取位置。\n\n谢绍敏（以红色墨水／红色布条迅速完成血书动作）：还 我 青 岛\n\n【舞台】全场肃然起敬。让“还我青岛”落地后留出短暂静默。\n谢绍敏（挥手，声震礼堂）：今日之耻，是四万万国人之耻！今日之辱，是中华民族之辱！沉默即帮凶，退让\n便是亡国！我辈青年，宁为救国死，绝不忍辱生！\n\n【Cue】血书不是写实伤害，而是舞台符号；重点是“全场突然安静”与视觉焦点。\n\n第三场｜夜定国策·誓启风雷\n【舞台】全场肃立，灯光聚焦主席台。学生由“争论”转入“作出决定”的统一姿态。\n【PPT】保持 P05，不换页；只可在四项决议出现时轻微叠加“5 月 3 日／明日五月四日”等文字，不使用复杂动\n画。\n【灯光】L12 调整为中心高位光，邓中夏、谢绍敏为主要视觉中心；学生群体形成完整面向。\n\n【舞美】桌面中央清出一块空位，作为决议／血书展示区；其余道具不移动。\n\n【音乐】M16：《觉醒年代》“年少”或“运筹”类思考氛围；低速、克制，从困惑进入坚定。\n邓中夏（上前一步，目光坚定，面向全场）：事已至此，无需迟疑！即刻集会表决，定下救国对策，唤醒全国\n民心！\n\n全场（齐声应和）：赞同！誓死救国！\n\n谢绍敏（高举血书衣襟，庄严宣读 5 月 3 日大会四项最终决议）：诸位同窗，今日北大法科全体大会，联合北\n京十余校学生代表，一致表决通过四条铁令！\n\n谢绍敏：第一！联合各界同胞，举国同心，誓死力争山东主权！\n\n谢绍敏：第二！通电巴黎中国专使，宁死不屈，坚决拒绝签署丧权辱国和约！\n\n谢绍敏：第三！通电全国各省，定于五月七日国耻日，举国同步举行爱国示威！\n\n谢绍敏：第四！提前行动！明日——五月四日！北京各校学子，齐集天安门，举行学界大示威！\n\n【舞台】全场掌声雷动，群情激昂。不要立即大喊，先由掌声铺开，再进入行动部署。\n匡互生（高声呐喊）：今夜起，全员连夜筹备！制标语、传通告、联各校！\n\n匡互生：我们要用青年之声，刺破黑暗，唤醒沉睡中华！\n\n邓中夏（沉稳收尾，目光望向无尽黑暗）：五月三日的长夜，没有退缩、没有妥协！\n\n邓中夏：今夜红楼星火，终将燎原千里！\n\n邓中夏：明日天安门前，便是我辈青年，为国发声、为民请命的战场！\n\n全场学生（握拳齐呼）：誓死力争！还我青岛！\n\n【灯光】由中心光逐步扩大到全场，准备把“决定”视觉转换成“集结”。\n\n【音乐】M16 结束不落黑；M17 提前叠入第一层脚步声，让下一场从“决定”直接变成“行动”。\n\n第四场｜集结力量·青年出发\n【舞台】原稿“四张桌子梯形”取消实体要求，统一轻装执行。学生游行队伍从舞台边缘进入，旗帜、横幅高\n举，队伍乱中有序，持续向中央汇聚。\n【PPT】P07“北京街头／历史照片质感”。以演员队伍为主体，背景只做时代空间延伸。\n【灯光】L13：舞台光逐步扩大并向队伍前进方向推移；队伍越集中，光面越完整。\n\n【舞美】旗帜、横幅提前在上场口分配。横幅文字：誓死力争、还我青岛、拒绝在和约上签字、废除二十一\n条、外争主权，内除国贼。\n\n【音乐】M17：《觉醒年代》“势不可挡”或同类大编制行进管弦；以脚步作为节拍基础，音乐不盖口号。\n【演员调度】一名男生、一名女生位于队伍最前方带头领喊；其余学生形成 2—3 层流动队形，不排成笔直方\n阵。\n\n领喊（男）：外争主权！\n\n众人：外争主权！\n\n领喊（女）：内除国贼！\n\n众人：内除国贼！\n\n【舞台】队伍继续向前，不在中央突然停死；最后形成自然聚拢，为下一场天安门请愿的中心构图准备。\n【音乐】M17 继续，不换歌；只在下一场第一句台词前压低 20%—30%。\n【Cue】这场的重点不是“摆造型”，而是让观众看到青年人数正在从少到多、从散到整。\n\n第五场｜天安门前·学生游行与请愿\n【舞台】背景为天安门。队伍到桌子前后分成四个小组，每组围站桌子，形成向中央聚焦的大会式构图。\n【PPT】P08“天安门／1919 年北京街景”；可缓慢推近，但不要花哨转场。\n【灯光】L13 延续宽面光；谢绍敏站桌上时中心光略收，保证人物面部和横幅同时清楚。\n\n【舞美】桌子固定在安全位置；演员站桌前先确定踩踏点与上下顺序。横幅在四组周围形成前后层次。\n\n【音乐】M18：《觉醒年代》“我们的同胞”或原创大编制；领喊之间留出空隙，台词段落必须主动压乐。\n谢绍敏（奋力站上桌子，迎着所有人的目光，声音激动，带着满腔悲愤）：同胞们！大家睁大眼睛好好看一\n看！这就是那些西方列强天天挂在嘴边的所谓公平！所谓的正义！？这就是威尔逊许诺给全世界的公理！他们\n毫无顾忌地欺骗整个中国，欺骗我们四万万受尽苦难的中国人民！这是一场赤裸裸、毫不掩饰的奇耻大辱！可\n我们的北洋政府呢？他们对此视而不见、麻木不仁！他们早就不再是为老百姓谋福祉的政府！他们已经沦为列\n强的走狗，心甘情愿地充当帮凶，帮助外来的势力压榨、欺凌我们自己的同胞！难道我们就要这样忍气吞声，\n任由国土被瓜分、尊严被践踏吗！\n\n匡互生（紧跟着站上桌子，怒火难平，高声呐喊）：还有那个美国总统威尔逊！之前说得多么冠冕堂皇！满口\n都是民族自决、世界和平！到头来，他从头到尾就是一个骗子，一个彻头彻尾的大骗子！他刻意欺骗我们善良\n的中国人！肆意侮辱我们中国人的尊严！处心积虑地愚弄我们全体中国人民！所谓的公理，不过是强者用来掠\n夺弱者的谎言！\n\n邓中夏（神情肃穆，声音洪亮有力）：同胞们！今天，我们聚集在这里，就是要向北洋政府郑重请愿，把巴黎\n和会背后肮脏的阴谋公之于天下！我们要让全北京、全中国的老百姓，都清楚地知道真相！让每一个国人都明\n白，我们正在面临怎样的亡国危机！请大家牢牢记住，无论是什么人，无论有多大的势力，只要胆敢妄图灭亡\n我们的国家、消灭我们的民族，我们每一个爱国青年，就一定会和他们血战到底！\n\n游行队伍（齐声怒吼）：血战到底！\n\n匡互生：誓死力争！\n\n游行队伍：誓死力争！\n\n谢绍敏：还我青岛！\n\n游行队伍：还我青岛！\n\n【舞台】口号结束后不要退场。全体保持举旗、抬头、向前看的状态，情绪从“演讲”继续转成“行动”。\n【灯光】口号三连时依次略抬亮度，第三句“还我青岛”后维持高亮半拍。\n\n【音乐】M18 在最后一句后不完全结束，给 M19 做无缝衔接。\n\n第六场｜文人领导·抗争开始\n【舞台】陈独秀、李大钊站在最中央桌子上，其余游行学生自发围拢，形成“思想核心—青年群体”两层构图。\n【PPT】P08 保持天安门历史空间，不换页；必要时只做缓慢景深或暗角。\n【灯光】L14：中心高位光照李大钊、陈独秀，外围学生保持完整轮廓；口号时扩面，台词时集中。\n\n【舞美】桌子位置提前锁定；两位演员上下桌路线固定，不与前排学生抢位。\n\n【音乐】M19：《觉醒年代》“为了觉醒”→强烈管弦。人物台词时压低，口号时提升，最后一句口号后保留持\n续鼓点。\n李大钊（目光坚定，声音厚重沉稳）：同胞们！今天我们走上街头发出的每一声呐喊，不是一时冲动的呼喊，\n而是千千万万渴望光明的中国人，对中国美好未来发自心底的心声！我们今天所做的一切，冒着风险挺身而\n出，不为个人名利，不为一己之私，全部都是为了守护我们国家来之不易的主权，为了守护我们子孙后代能够\n堂堂正正地活下去的希望！今天的抗争，将会唤醒沉睡的国人！\n\n陈独秀（目光扫过在场所有热血青年，满怀感慨，语气激昂）：今日！就在此时此刻！我们正亲身经历一场足\n以彻底改变整个中国历史走向的重大事件！长久以来，无数先辈都在苦苦探寻救国的道路，却屡屡陷入黑暗。\n今天，能够和在座每一位心怀赤诚的青年，一同亲身投身这场历史上前所未有的爱国革命，亲眼见证星火燃\n起，这对于我们而言，是无上的荣幸！是无可比拟的光荣！\n\n陈独秀、李大钊（齐声）：还我主权！\n\n游行队伍：还我主权！\n\n陈独秀、李大钊（齐声）：誓死力争！\n\n游行队伍：誓死力争！\n\n陈独秀、李大钊（齐声）：严惩国贼！\n\n游行队伍：严惩国贼！\n\n陈独秀、李大钊（再次高声）：严惩国贼！\n\n游行队伍：严惩国贼！\n\n【舞台】最后一句“严惩国贼！”结束后所有人保持高举手臂、举旗状态，不退场、不散队，只留半拍口号余\n震。\n【灯光】L14 不立刻熄灭；转入 L15A 侧光轮廓，让所有人变成一整片“向前的人潮”。\n\n【音乐】M19 尾段持续，不做传统终止式；准备直接进入集合铃。\n\n第七场｜铃响·游行不断·走向赵家楼\n【舞台】第五场/第六场最后的游行队伍不退场。后排先转向前方，前排随后跟上；队伍由“围拢”重新变成向同\n一方向推进的游行纵队。\n【PPT】P12：天安门→北京街头→赵家楼方向。画面连续移动，不黑屏，不重新切一个完全陌生的场景。\n【灯光】L15A：侧光保留人物轮廓，光区跟随队伍前进方向逐步推进；最后把队伍最前端留在舞台中央偏前。\n\n【舞美】幕布从两侧缓缓向中间收拢，但必须留出可供队伍穿行的通道；后台人员不进入主要表演区。\n\n【音乐】M20：三声短促、清晰的校园集合铃。第一声：所有人转头；第二声：开始整队；第三声：全队同步\n迈步。M21 随后无缝进入“势不可挡”行进段。\n\n【旁白】同学们，这场属于青年学生的爱国运动，到这里远远没有结束。他们没有被眼前的阻碍吓倒，毅然走\n出天安门，走进北京城的大街小巷。这一束抗争的星火，随着一双双脚步一路向前，传遍神州大地。\n【旁白】一个伟大的、足以改写民族命运的历史性时刻，正在这空前的宏大游行中，以铿锵有力的步伐继续踏\n来。\n【舞台】铃声结束后不出现静止黑幕。队伍继续行进，前排逐渐离开主视觉中心，后排仍补入，制造“人潮没有\n结束”的感觉。\n【Cue】三声铃是全剧 2→3 的核心桥：它不是换场提示，而是剧情中的“集合信号”。第三声铃落下的同时，全\n体迈步。\n\n【音乐】M21 保持脚步＋口号前景，进入 Part 3 第一场时不换节拍；Part 3 台词开始后再主动压低音乐。\n场次              PPT/背景             音乐/音效           灯光/舞美现场执行\n\n1 雨夜惊讯·红楼夜会     P04 红楼内景           M14 黑暗类低沉氛围     L12 暗光；1 桌 1 椅；报\n                                                   纸/纸张/书籍；空间压抑\n\n2 真理的辩论·巴黎死局    P05 巴黎和会/山东        M15 黑暗→渐强       L12 追光邵飘萍；桌作讲\n                                                   台；血书用安全红色材料\n\n3 夜定国策·誓启风雷     P05 保留             M16 年少/运筹类      中心光；四项决议；掌声\n                                                   后不黑场，脚步预入\n\n4 集结力量·青年出发·青   P07 北京街头           M17 势不可挡        L13 扩面推光；旗帜/横\n年出发                                                幅分发；队伍由散到整\n\n5 天安门前·学生游行与请   P08 天安门            M18 我们的同胞/大编制   L13 宽面；1 桌固定；桌\n愿                                                  上站位先排安全路线\n\n6 文人领导·抗争开始     P08 保持             M19 为了觉醒→管弦     L14 中心高位；李大\n                                                   钊/陈独秀为核心；口号\n                                                   抬乐\n\n7 铃响·游行不断·走向赵   P12 天安门→街头→赵家      M20 三声集合铃→M21   L15A 侧光；半合幕留通\n家楼              楼                  势不可挡            道；不黑屏，队伍继续走\n\n第一场｜连续游行·进入赵家楼\n【PPT/背景】北京街头／天安门周边历史风格画面，从上一场的天安门画面连续过渡；队伍运动时再逐步显\n出赵家楼方向的街巷感。\n【舞台】上一场的游行队伍不撤，继续向前。前排学生从舞台中央向前压进，后排队伍从两侧补入，形成“人\n流仍在不断”的效果。不要重新组织成一场独立游行，要让观众觉得只是刚才那一队人继续走。\n【音乐/音效】集合铃后三声结束后，铃声退出；整齐脚步＋连续口号＋低鼓。音乐保持同一首或无缝换到更\n紧凑的行进段，第一句台词前将音乐压低。\n众学生（挥舞横幅，齐声呐喊）：外争主权，内惩国贼！废除二十一条！誓死力争，还我青岛！\n\n段振声（站在队伍前方，抬手示意全体向前）：同胞们！北洋政府软弱无能，竟在条约上妥协退让，将山东拱\n手相让！今日我辈若是沉默，则国将不国！\n匡互生（高举血书）：外争主权，内惩国贼！\n谢绍敏（向队伍前方挥手）：同学们，同胞们！卖国贼曹汝霖、章宗祥出卖国家利益，罪不可恕！今天，我们\n游行冲向赵家楼，闯进曹府，让他们付出代价！\n游行队伍（群体回应）：打倒卖国贼！\n【舞台】队伍继续向前推进，最前排先从巷口方向退出视觉中心，后排学生依次跟进；不等待全场清空。口号\n逐渐拉远，灯光同步缩窄，直接显出赵家楼巷口。\n【转场】从“宏大游行”切到“局部冲突”只靠队形和灯光完成：大队人潮退至暗区，留学生甲与警官进入巷口亮\n区。这样 Part 3 的第一场结束不再依赖黑幕。\n\n转场片段｜赵家楼巷口\n\n【舞台】灯光微亮。学生甲手拿写有“冤”字的血书，跪在巷口。警官走上前。\n\n警官（皱眉、俯视）：同学，有冤情去检察厅起诉，来这儿做甚？\n\n学生甲（抬头、声音压着悲愤）：我的冤情太大，检察厅接不下我的状子！\n\n警官（追问）：那你有何冤屈？\n\n学生甲（举起血书）：我喊冤，是为了四万万中国人喊冤！\n\n【舞台】一句话落地后，留半拍静默，随后远处再次传来学生队伍的脚步声，迅速把舞台推入曹府场面。\n\n第二场｜曹府门前\n\n【舞台】曹府大门前，军警列队站守。为避免舞台过度写实，使用旗帜、哨声、队形和身体拦截表现“封锁”，\n\n不需要真实武器道具。邓中夏带领大批学生冲到门前，奋力拍门。\n\n【音乐/音效】连续拍门声＋军警喝止声＋密集脚步。\n\n邓中夏、众学生（砸门，高声呼喊）：开门！交出卖国贼！\n\n军警（横臂阻拦，声音严厉）：站住！曹总长宅邸，不得入内！\n\n匡互生（跨步上前，正气凛然）：我们是北京大学的学生，为救国而来！我们要质问府中的卖国贼，为何出卖\n\n山东国土！\n\n邓中夏（回身面向身后学生）：同学们，国贼就在里面，冲进去！\n\n众学生（齐声回应）：冲！\n\n谢绍敏（对着军警，声音压住怒火）：同胞们，你们该去山东抵御外敌，而不是在这里为卖国贼看家护院！\n\n匡互生（面向军警后转向学生）：同胞们，我相信我们本是一家人。现在被你们挡在门外的，是你们的亲兄弟、\n\n亲姐妹，他们每一个都是爱国青年！捍卫国土！保卫主权！\n\n众学生（齐声）：捍卫国土！保卫主权！\n\n匡互生（再次面向军警，声音放缓却有力）：兄弟们，相信你们同样是爱国的中国人。倘若尚存良知，就不要\n\n再阻拦我们！\n\n【舞台】匡互生带领同学们一拥而入，军警退让。灯光切换。\n\n第三场｜曹府内\n\n【舞台】曹府屋内，仆人惊慌地上前。舞台尽量保持空旷，以演员走位制造“空间”而不新增实体布景。\n\n仆人（惊慌失措，后退）：你们要做什么？\n\n邓中夏（上前一步，打断对方）：交出章宗祥！你窝藏卖国贼！\n\n谢绍敏（手指侧门方向）：就是他！驻日公使，《二十一条》的帮凶！\n\n章宗祥（声音颤抖、神色慌乱）：你……你们是什么人？擅闯民宅，还有没有王法了？\n\n邓中夏（大步逼近，压迫感强但不肢体冲撞）：王法？你卖国求荣，令大好河山沦入敌手，你还有脸谈论王法？\n\n章宗祥（向后退半步）：你……你……血口喷人！签订条约是政府决议，与我何干？\n\n匡互生（直指章宗祥）：与你何干？你身为驻日公使，奴颜婢膝，损害国家权益，令四万万华夏同胞蒙受屈辱！\n\n今天你必须给全国民众一个交代！\n\n众学生（齐声怒吼）：打死卖国贼！打死卖国贼！\n\n章宗祥（惊惧、后退）：殴打政府官员，你们不怕杀头吗？\n\n谢绍敏（站定、压住全场声音）：谭嗣同有言：各国变法，无不从流血而成，今中国未闻有因变法而流血者，\n\n此国之所以不昌也。有之，请自嗣同始！山东是中国固有的领土，我们必定要收回！你们这些卖国贼，终将被\n\n钉在历史的耻辱柱上！\n\n【舞台】学生上前撕毁象征卖国的协议或纸张，动作保持象征性，不安排危险的真实破坏。\n\n学生甲（匆忙从门外冲入，喘息）：各位学长！大批警察正向这边赶来，曹汝霖已经从后门逃走，我们赶快撤\n\n离！\n\n【音乐/音效】远处脚步声、哨声逐渐逼近；音乐进入紧张段。\n\n【舞台】学生集体有序撤离，场内只余下远去的呼喊回声。全场灯光熄灭。\n\n尾声可选｜现代学生追光\n\n【舞台】一束追光打下，现代学生独自留在舞台中央，内心感慨百年前青年的热血。此段仅作为可选收束，不\n\n影响主线。\n\n现代学生（看着黑暗中的舞台，轻声）：原来书里的一行字，真的可以走下来，站到我们面前。\n\n【音乐/音效】只留一条极简长音或钢琴音，随后完全静音。\n\n三、演出总时间表\n以下为舞台执行用工作估算；Part 1 时长沿用原稿，其余两部分根据现有台词量、调度和口号停顿估算。正式联排后应以\n\n秒表复核。\n\n Part          段落             建议时长         节奏重点\n\n Part 1        教室·读史          1:00—1:20    建立现实线、翻书与呼\n                                           吸\n\n Part 1        黑场·历史扑面而来      0:30—0:45    穿场冲击、脚步与口号\n\n Part 1        背景幕挑字          0:20—0:30    1919→北京→北大→红\n                                           楼\n\n Part 1        人物依次登场         1:10—1:30    旁白报身份，动作建立\n                                           人物\n\n Part 1        巴黎和会消息传入       1:20—1:40    报纸扩散，情绪上升\n\n Part 1        红楼·争论          2:20—2:50    全段最长，层层加压\n\n Part 1        锤击·安静          0:20—0:30    声音骤停，留白\n\n Part 1        思想爆发·青年站出      1:20—1:40    由个人转向群体\n\n Part 1        最终群像           0:40—0:55    定格 function render(){let names={home:"工作总览",mine:"我的剧本",script:"总剧本",schedule:"排班表",roles:"角色管理",ann:"导演公告",director:"导演模式"};$("crumb").textContent=names[page];document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("content").innerHTML=({home:home,mine:mine,script:script,schedule:schedule,roles:roles,ann:annPage,director:director}[page])();if(page==="director")drawStage();counts()}
function home(){let assigned=d.people.filter(p=>p.assignee).length;return `<div class="card welcome"><div><span class="pill">剧组工作台 · 内部协作</span><h2>欢迎回来，${esc(d.user.name)}。</h2><p class="sub">让每一场排练更清晰，让每一次上场都准备充分。</p><div class="row"><button class="primary" onclick="go('mine')">继续准备剧本 ↗</button><button onclick="go('schedule')">查看排练安排</button></div></div></div><div class="grid stats"><div class="card stat"><span>角色已分配</span><strong>${assigned}/${d.people.length}</strong></div><div class="card stat"><span>已发布排练</span><strong>${d.schedules.filter(s=>s.status==="published").length}</strong></div><div class="card stat"><span>导演公告</span><strong>${d.ann.length}</strong></div><div class="card stat"><span>我的身份</span><strong style="font-size:20px">${esc(d.user.role)}</strong></div></div><div class="eyebrow">YOUR WORKSPACE</div><h2>今天，从这里开始</h2><div class="grid features">${[['mine','01 / PERSONAL','我的剧本','自动筛出当前角色的台词段落，并保留相关舞台提示。'],['script','02 / MASTER SCRIPT','总剧本','搜索全文，按人物定位台词。'],['schedule','03 / REHEARSAL','排班表','导演手动创建并发布排练安排。'],['director','04 / STAGE','导演模式','拖动演员、规划走位，并设计范围光、追光等光区。']].map(x=>`<div class="card feature" onclick="go('${x[0]}')"><b>${x[1]}</b><h3>${x[2]}</h3><p>${x[3]}</p>↗</div>`).join("")}</div><div class="grid two"><div class="card"><h3>近期排练</h3>${d.schedules.filter(s=>s.status==="published").length?d.schedules.filter(s=>s.status==="published").map(s=>`<div class="item"><h4>${esc(s.title)}</h4><p>${esc(s.date)} ${esc(s.time)} · ${esc(s.location)}</p></div>`).join(""):'<div class="empty"><strong>暂无排练安排</strong>等待导演发布下一次排练计划。</div>'}</div><div class="card"><h3>导演公告</h3>${d.ann.length?d.ann.slice(-2).reverse().map(a=>`<div class="item"><h4>${esc(a.title)}</h4><p>${esc(a.body)}</p></div>`).join(""):'<div class="empty">暂无公告。</div>'}</div></div>`}
function paper(txt,character){return txt.split("\n").map(line=>{let m=false;if(character){let aliases=[character];if(character.includes("/"))aliases.push(character.split("/")[0]);aliases=aliases.map(x=>x.replace(/（.*?）/g,"").replace(/\(.*?\)/g,"").trim()).filter(Boolean);m=aliases.some(n=>line.trim().startsWith(n+"：")||line.trim().startsWith(n+":")||line.trim().startsWith(n+"（"))}return `<div class="scriptline ${m?"mine":/^[（\[].*[）\]]$/.test(line.trim())?"cue":""}">${esc(line)||"&nbsp;"}</div>`}).join("")}
function cleanRoleName(s){return String(s||"").replace(/（.*?）/g,"").replace(/\(.*?\)/g,"").replace(/\s+/g,"").trim()}
function personalPaper(txt,character){
 if(!character)return '<div class="empty">请先选择你的角色。</div>';
 let aliases=[character];if(character.includes("/"))aliases.push(character.split("/")[0]);aliases=aliases.map(cleanRoleName).filter(Boolean);
 let lines=String(txt||"").split(/\r?\n/),section="剧本台词",out=[],found=0,canContinue=false;
 const sectionRx=/^(PART\s*[123]|Part\s*[123]|第.{1,8}[段场幕]｜?.*)/i;
 const cueRx=/^(【舞台】|【音乐|【灯光】|【PPT|【转场】|【舞美】|【Cue】|一、总人物表|二、剧本内容|三、导演寄语|统一格式说明|工作估算时长|舞台\/演员调度|<PARSED TEXT|Cue\s+)/i;
 const actionRx=/^(坐在|站在|靠在|从后台|独自站|在一旁|走到|走向|拿着|手持|低头|抬头|整理|翻阅|翻看|快速进入|默默观察|环顾|点头|示意|停下|转身|把.{0,20}(放|拿|递|摊|折)|所有人|众人|学生们|演员|灯光|音乐|舞台|背景|桌子|黑幕|全场|形成|保持|准备|建议|工作估算|仅使用|继续沿用|空间切换|人物全部进入|旁白只负责)/;
 const stopRx=/^(<PARSED TEXT|《北大红楼|学生剧本|总工作剧本|序号\s|人物\s|舞台功能|Part\s*\d|PART\s*\d|第.{1,8}[段场幕]｜?.*|说明：|注：|Cue\s+)/i;
 for(let raw of lines){let line=raw.trim();if(!line)continue;
  if(sectionRx.test(line)){section=line;canContinue=false;continue}
  if(cueRx.test(line)||stopRx.test(line)){canContinue=false;continue}
  let m=line.match(/^([^：:\n（）()]{1,28})(?:（[^）]*）|\([^)]*\))*[：:]\s*/);
  if(m){let speaker=cleanRoleName(m[1]);if(!aliases.some(a=>speaker===a||speaker.startsWith(a)||(speaker.includes("、")&&speaker.includes(a)))){canContinue=false;continue}
   let body=line.slice(m[0].length).replace(/（[^）]*）|\([^)]*\)/g,"").replace(/【[^】]*】/g,"").trim();
   if(!body||actionRx.test(body)){canContinue=false;continue}
   out.push({section,speaker,body});found++;canContinue=true;continue;
  }
  let prev=out[out.length-1];
  if(canContinue&&prev&&!actionRx.test(line)&&!stopRx.test(line)&&!/[。！？；]$/.test(prev.body)){prev.body+=line;canContinue=!/[。！？；]$/.test(prev.body);continue}
  canContinue=false;
 }
 if(!found)return '<div class="empty"><strong>暂未识别到这个角色的纯台词</strong>请核对角色名称，或在“角色管理”中使用剧本中的正式称呼。系统不会补写原稿里没有的台词。</div>';
 let html='',last='';for(let i=0;i<out.length;i++){let x=out[i];if(x.section!==last){html+=`<div class="dialogue-section">${esc(x.section)}</div>`;last=x.section}html+=`<div class="dialogue-line" data-dialogue="${i}"><b>${esc(x.speaker)}</b><span>${esc(x.body)}</span></div>`}
 return `<div class="dialogue-reader" id="dialogueReader">${html}</div><p class="sub" style="margin-top:10px">仅显示识别到的角色台词；舞台、灯光、音乐、PPT 和动作提示均已过滤。共 ${found} 段。</p>`;
}
function mine(){return `<div class="pagehead"><div><div class="eyebrow">PERSONAL SCRIPT</div><h2>我的剧本</h2><p class="sub">专注记忆台词：只显示当前角色说出口的话，不混入舞台调度、灯光、音乐或动作说明。</p></div><button onclick="go('script')">前往总剧本</button></div><div class="card"><label>我的角色</label><select id="mychar" onchange="d.user.character=this.value;save();render()">${d.people.map(p=>`<option ${p.name===d.user.character?"selected":""}>${esc(p.name)}</option>`).join("")}</select><div class="read-controls"><input id="ms" placeholder="搜索我的台词" oninput="searchLines('mytext',this.value)" style="max-width:260px"><label>字号 <input type="range" min="15" max="30" value="19" oninput="document.querySelectorAll('#mytext .dialogue-reader').forEach(e=>e.style.fontSize=this.value+'px')"></label><button onclick="toggleDialogueTest()">台词遮挡自测</button><button onclick="copyMyLines()">复制我的台词</button></div><div id="mytext">${d.script?personalPaper(d.script,d.user.character):'<div class="empty">总剧本尚未载入。</div>'}</div></div>`}
function toggleDialogueTest(){document.querySelectorAll('#mytext .dialogue-line').forEach(e=>e.classList.toggle('hiddenline'));say('已切换台词遮挡模式，再点一次恢复')}
function copyMyLines(){let t=[...document.querySelectorAll('#mytext .dialogue-line')].map(e=>e.querySelector('b').textContent+'：'+e.querySelector('span').textContent).join('\n\n');if(!t)return say('当前没有可复制的台词');navigator.clipboard?.writeText(t).then(()=>say('纯台词已复制')).catch(()=>say('浏览器未开放剪贴板权限，请手动选中复制'))}

function script(){
 const tabs=[['overview','总览','目录与岗位入口'],['text','剧本文字','正文与人物对白'],['people','人物表','人物与舞台功能'],['stage','舞台调度','动作、走位、转场'],['light','灯光执行','灯光 Cue'],['sound','音乐音效','音乐与音效 Cue'],['ppt','PPT／背景','画面提示'],['props','道具／后台','道具与后台安排'],['timing','时间表／清单','执行表与终演核对'],['all','全文','原稿完整阅读']];
 const active=window.scriptLayer||'overview', raw=d.script||'', lines=raw.split(/\r?\n/), tr=x=>String(x||'').trim();
 const cue=x=>{x=tr(x);if(/^【舞台】|^【转场】|^【舞美】/.test(x))return 'stage';if(/^【灯光】/.test(x))return 'light';if(/^【音乐】|^【音乐\/音效】|^【音效】/.test(x))return 'sound';if(/^【PPT】|^【PPT\/背景】/.test(x))return 'ppt';return ''};
 const heading=/^(PART\s*[123]|一、|二、|三、|四、|五、|六、|七、|八、|九、|十、|第.{1,8}[段场幕])/i;
 const timing=/^(三、演出总时间表|四、配乐与音效串联总表|五、|六、|七、|八、|九、|十、|终演前锁定清单|M\d{2}\s|L\d{2}\s|P\d{2}\s|岗位／事项|编号\s+节点)/;
 const pe=lines.findIndex(x=>/^二、剧本内容/.test(tr(x))), peEnd=pe<0?lines.length:pe;
 function ok(x,i){let t=tr(x),c=cue(t);if(!t)return false;if(active==='all')return true;if(active==='people')return i<peEnd;if(['stage','light','sound','ppt'].includes(active))return c===active;if(active==='timing')return timing.test(t)||/总时间表|执行总表|终演前锁定清单|岗位／事项/.test(t);if(active==='props')return /道具|后台|舞美|布景|执行要求/.test(t)&&(/^[七八九十、]/.test(t)||timing.test(t));if(active==='text')return i>=peEnd&&!c&&!timing.test(t);return false}
 let body='';
 if(active==='overview'){
  let hs=lines.map((t,i)=>({t:tr(t),i})).filter(x=>/^(PART\s*[123]|一、总人物表|二、剧本内容|三、演出总时间表|四、配乐与音效串联总表|五、|六、|七、|八、|九、|十、)/i.test(x.t));
  body=`<div class="script-hero"><div class="eyebrow">MASTER SCRIPT · READING ROOM</div><h3>${esc(d.scriptTitle||'《北大红楼·五四运动》青春剧｜总工作剧本')}</h3><p>按内容和剧组岗位分层阅读。演员可以查看正文与人物，舞台组查看调度，灯光、音控和 PPT 组可以直接筛选自己负责的提示。内容均取自已录入的原稿，不擅自改写台词。</p><div class="script-metrics"><span><b>${lines.length}</b><small>原稿行数</small></span><span><b>${(raw.match(/【舞台】/g)||[]).length}</b><small>舞台提示</small></span><span><b>${(raw.match(/【灯光】/g)||[]).length}</b><small>灯光提示</small></span><span><b>${(raw.match(/【音乐(?:\/音效)?】|【音效】/g)||[]).length}</b><small>音频提示</small></span></div></div><div class="script-outline"><h3>剧本目录</h3><p class="muted">点击任意目录项，直接定位全文对应段落。</p><div class="outline-grid">${hs.map((h,n)=>`<button class="outline-item" onclick="jumpScriptLine(${h.i})"><span>${String(n+1).padStart(2,'0')}</span><b>${esc(h.t)}</b><i>打开 ↗</i></button>`).join('')}</div></div><div class="script-note"><b>阅读说明</b><p>岗位阅读层按原稿中的【舞台】【灯光】【音乐/音效】【PPT/背景】【转场】标记分类。若原稿没有明确标记，不会擅自推断岗位指令；可以随时切换「全文」核对。</p></div>`;
 }else if(active==='people'){
  body=`<div class="script-hero compact"><div class="eyebrow">CHARACTER DIRECTORY</div><h3>人物表 · 角色与舞台功能</h3><p>展示原稿「总人物表」部分。</p></div><div class="script">${paper(lines.slice(0,peEnd).join('\n'),'')}</div>`;
 }else if(active==='all'){
  body=`<div class="script-toolbar"><span>原稿全文 · 保留原有顺序</span><button onclick="bigText()">大字阅读</button><button onclick="downloadScript()">导出文本</button></div><div id="fulltext" class="script fullscript">${paper(raw,'')}</div>`;
 }else{
  const meta=tabs.find(t=>t[0]===active);let groups=[],g={title:'剧本内容',items:[]};
  lines.forEach((x,i)=>{let t=tr(x);if(!t||!ok(t,i))return;if(heading.test(t)){if(g.items.length)groups.push(g);g={title:t,items:[]}}g.items.push({t,type:cue(t)})});if(g.items.length)groups.push(g);
  const count=groups.reduce((n,x)=>n+x.items.length,0);
  body=`<div class="script-hero compact"><div class="eyebrow">ROLE-BASED VIEW</div><h3>${esc(meta[1])}</h3><p>${esc(meta[2])}。每条内容都来自已录入的终演现场版总剧本。</p><div class="script-toolbar"><span>共 ${count} 条内容</span><input placeholder="搜索当前阅读层" oninput="searchLines('layerText',this.value)"><button onclick="bigText()">大字阅读</button></div></div><div id="layerText" class="layer-content">${groups.map(x=>`<section class="script-section"><div class="script-section-title">${esc(x.title)}</div><div class="script-section-body">${x.items.map(y=>`<article class="script-block ${y.type?'cue-'+y.type:'prose'}"><div class="script-block-tag">${y.type?({stage:'舞台调度',light:'灯光执行',sound:'音乐／音效',ppt:'PPT／背景'}[y.type]):'正文／台词'}</div><div class="script-block-text">${esc(y.t)}</div></article>`).join('')}</div></section>`).join('')||'<div class="empty"><strong>本层暂未找到内容</strong>请切换「全文」核对原稿。</div>'}</div>`;
 }
 return `<div class="pagehead"><div><div class="eyebrow">MASTER SCRIPT · LAYERED READER</div><h2>总剧本</h2><p class="sub">分层查看、按岗位阅读、逐段定位；原稿正文保持不变。</p></div><div class="row"><button onclick="downloadScript()">导出文本</button><button class="primary" onclick="scriptEditor()">导入 / 编辑</button></div></div><div class="script-tabs">${tabs.map(t=>`<button class="${active===t[0]?'active':''}" onclick="setScriptLayer('${t[0]}')"><b>${esc(t[1])}</b><small>${esc(t[2])}</small></button>`).join('')}</div>${body}`;
}
function setScriptLayer(layer){window.scriptLayer=layer;render()}
function jumpScriptLine(index){window.scriptLayer='all';render();setTimeout(()=>{const el=document.querySelectorAll('#fulltext .scriptline')[index];if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.background='rgba(201,155,96,.2)';setTimeout(()=>el.style.background='',1800)}},80)}

function scriptEditor(){modal(`<h3>导入 / 编辑总剧本</h3><label>剧本标题</label><input id="stitle" value="${esc(d.scriptTitle)}"><label>剧本文本</label><textarea id="stext" style="min-height:300px" placeholder="粘贴完整定稿……">${esc(d.script)}</textarea><label>或选择 .txt / .md 文件</label><input type="file" accept=".txt,.md" onchange="readText(this)"><div class="modalactions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveScript()">保存剧本</button></div>`)}
function readText(i){if(i.files[0]){let r=new FileReader();r.onload=()=> $("stext").value=r.result;r.readAsText(i.files[0])}}
function saveScript(){d.scriptTitle=$("stitle").value;d.script=$("stext").value;save();closeModal();render();say("剧本已保存在当前设备")}
function downloadScript(){if(!d.script)return say("还没有剧本");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d.script],{type:"text/plain;charset=utf-8"}));a.download=(d.scriptTitle||"总剧本")+".txt";a.click();URL.revokeObjectURL(a.href)}
function searchLines(id,q){document.querySelectorAll("#"+id+" .scriptline, #"+id+" .dialogue-line").forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q.toLowerCase())?"":"none")}
function filterPerson(c){document.querySelectorAll("#fulltext .scriptline").forEach(x=>x.style.display=!c||x.textContent.startsWith(c+"：")||x.textContent.startsWith(c+":")?"":"none")}
function bigText(){let e=$("mytext");e.style.fontSize=e.style.fontSize==="20px"?"15px":"20px"}
function selfTest(){let a=[...document.querySelectorAll("#mytext .mine")];if(!a.length)return say("暂未识别到台词；请检查格式是否为“角色名：台词”");a.forEach(e=>{e.dataset.t=e.dataset.t||e.innerHTML;e.innerHTML=e.innerHTML==="＿＿＿＿＿＿＿＿＿＿" ?e.dataset.t:"＿＿＿＿＿＿＿＿＿＿"});say("已切换台词自测显示")}
function schedule(){let director=d.user.role==="导演",items=d.schedules.filter(s=>s.status!=="cancelled").sort((a,b)=>a.date.localeCompare(b.date));return `<div class="pagehead"><div><div class="eyebrow">REHEARSAL PLANNER</div><h2>排班表</h2><p class="sub">每周排练由导演根据实际情况手动安排，不预设固定日期。</p></div>${director?'<button class="primary" onclick="editSchedule()">＋ 新建安排</button>':""}</div><div class="grid two"><div class="card"><h3>全部安排</h3>${items.length?`<div class="list">${items.map(s=>`<div class="item"><div class="row between"><h4>${esc(s.title)}</h4><span class="badge ${s.status}">${s.status==="published"?"已发布":"草稿"}</span></div><p>◷ ${esc(s.date)}　${esc(s.time)}<br>⌖ ${esc(s.location)}<br>${esc(s.content)}</p><div class="row" style="margin-top:10px">${s.status==="published"?(s.ack||[]).includes(d.user.name)?'<span class="badge published">已知晓 ✓</span>':`<button onclick="ack('${s.id}')">我已知晓</button>`:""}${director?`<button onclick="editSchedule('${s.id}')">编辑</button><button onclick="publish('${s.id}')">发布</button><button onclick="duplicate('${s.id}')">复制</button><button onclick="cancelSch('${s.id}')">取消</button><button onclick="acks('${s.id}')">确认情况</button>`:""}</div></div>`).join("")}</div>`:'<div class="empty"><strong>暂无排练安排，等待导演发布下一次排练计划</strong>'+ (director?'<button class="primary" onclick="editSchedule()">创建第一条安排</button>':'')+'</div>'}</div><div class="card"><h3>安排说明</h3><p class="sub">发布后，本工作台会显示通知并允许成员点击“我已知晓”。当前版本的确认记录只存在当前设备，不能自动汇总其他演员的确认。</p><div class="divider"></div><p class="sub">需要多人实时同步时，应将排班和确认数据接入共享数据库。</p></div></div>`}
function editSchedule(id,copy=false){let s=d.schedules.find(x=>x.id===id)||{id:"s"+Date.now(),title:"",date:"",time:"",location:"",content:"",target:"all",attendees:"",status:"draft",ack:[]};modal(`<h3>${id?"编辑排练安排":"新建排练安排"}</h3><div class="formgrid"><div class="span2"><label>安排名称</label><input id="sname" value="${esc(copy?"副本 - "+s.title:s.title)}"></div><div><label>日期</label><input id="sdate" type="date" value="${esc(s.date)}"></div><div><label>时间</label><input id="stime" value="${esc(s.time)}" placeholder="16:30—18:00"></div><div class="span2"><label>地点</label><input id="sloc" value="${esc(s.location)}"></div><div class="span2"><label>排练内容</label><textarea id="scontent">${esc(s.content)}</textarea></div><div class="span2"><label>通知对象</label><select id="starget"><option value="all">全体剧组成员</option><option value="selected" ${s.target==="selected"?"selected":""}>指定人员</option></select><input id="satt" style="margin-top:8px" value="${esc(s.attendees||"")}" placeholder="指定人员姓名，以顿号分隔"></div></div><div class="modalactions"><button onclick="closeModal()">取消</button><button onclick="saveSchedule('${id||""}','draft',${copy})">保存草稿</button><button class="primary" onclick="saveSchedule('${id||""}','published',${copy})">保存并发布</button></div>`)}
function saveSchedule(id,status,copy){let old=d.schedules.find(x=>x.id===id),s={id:copy||!old?"s"+Date.now():id,title:$("sname").value.trim(),date:$("sdate").value,time:$("stime").value,location:$("sloc").value,content:$("scontent").value,target:$("starget").value,attendees:$("satt").value.split(/[、,，]/).map(x=>x.trim()).filter(Boolean),status,ack:old?.ack||[]};if(!s.title||!s.date)return say("请填写安排名称和日期");if(old&&!copy)d.schedules=d.schedules.map(x=>x.id===id?s:x);else d.schedules.push(s);save();closeModal();render();say(status==="published"?"安排已发布":"已保存草稿")}
function publish(id){let s=d.schedules.find(x=>x.id===id);s.status="published";save();render();say("安排已发布")}
function duplicate(id){editSchedule(id,true)}function cancelSch(id){if(confirm("确定取消这条安排？")){let s=d.schedules.find(x=>x.id===id);s.status="cancelled";save();render()}}
function ack(id){let s=d.schedules.find(x=>x.id===id);s.ack=s.ack||[];if(!s.ack.includes(d.user.name))s.ack.push(d.user.name);save();render();say("已确认知晓")}
function acks(id){let s=d.schedules.find(x=>x.id===id);modal(`<h3>确认情况 · ${esc(s.title)}</h3><p>已确认：${esc((s.ack||[]).join("、")||"暂无")}</p><p class="sub">本地版本只能查看当前浏览器保存的确认信息。</p><div class="modalactions"><button onclick="closeModal()">关闭</button></div>`)}
function roles(){let director=d.user.role==="导演";return `<div class="pagehead"><div><div class="eyebrow">CAST & CHARACTERS</div><h2>角色管理</h2><p class="sub">角色分配、演员确认与剧本中已确认的人物关系。</p></div>${director?'<button class="primary" onclick="editPerson()">＋ 添加角色</button>':""}</div><div class="grid two"><div class="card"><h3>角色分配进度　${d.people.filter(p=>p.assignee).length}/${d.people.length}</h3><div class="tablewrap"><table class="table"><thead><tr><th>角色</th><th>演员</th><th>确认状态</th><th>操作</th></tr></thead><tbody>${d.people.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.assignee||"待分配")}</td><td>${p.confirmed?"已确认":"待确认"}</td><td>${director?`<button onclick="editPerson('${p.id}')">编辑</button>`:p.assignee===d.user.name&&!p.confirmed?`<button onclick="confirmRole('${p.id}')">确认</button>`:"—"}</td></tr>`).join("")}</tbody></table></div></div><div class="card"><div class="row between"><h3>人物关系</h3>${director?'<button onclick="editRel()">＋ 添加</button>':""}</div><p class="sub">只记录导演或剧本确认过的关系。</p>${d.relations.length?d.relations.map((r,i)=>`<div class="item">${esc(r.a)}　— <span class="pill">${esc(r.type)}</span> —　${esc(r.b)} ${director?`<button onclick="d.relations.splice(${i},1);save();render()">×</button>`:""}</div>`).join(""):'<div class="empty">人物关系尚未整理。</div>'}</div></div>`}
function editPerson(id){let p=d.people.find(x=>x.id===id)||{id:"p"+Date.now(),name:"",assignee:"",confirmed:false};modal(`<h3>${id?"编辑角色":"添加角色"}</h3><label>角色名称</label><input id="pname" value="${esc(p.name)}"><label>演员姓名</label><input id="passignee" value="${esc(p.assignee)}"><label><input style="width:auto" type="checkbox" id="pconfirmed" ${p.confirmed?"checked":""}> 已确认角色分配</label><div class="modalactions"><button onclick="closeModal()">取消</button><button class="primary" onclick="savePerson('${id||""}')">保存</button></div>`)}
function savePerson(id){let p={id:id||"p"+Date.now(),name:$("pname").value.trim(),assignee:$("passignee").value.trim(),confirmed:$("pconfirmed").checked,color:"#a9474c"};if(!p.name)return say("角色名称不能为空");if(id)d.people=d.people.map(x=>x.id===id?p:x);else d.people.push(p);save();closeModal();render()}
function confirmRole(id){d.people.find(x=>x.id===id).confirmed=true;save();render()}
function editRel(){modal(`<h3>添加人物关系</h3><label>人物 A</label><select id="ra">${d.people.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><label>人物 B</label><select id="rb">${d.people.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select><label>关系</label><input id="rtype" placeholder="师生 / 同学 / 同一阵营"><div class="modalactions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveRel()">添加</button></div>`)}
function saveRel(){if($("ra").value===$("rb").value||!$("rtype").value.trim())return say("请选择不同人物并填写关系");d.relations.push({a:$("ra").value,b:$("rb").value,type:$("rtype").value.trim()});save();closeModal();render()}
function annPage(){let director=d.user.role==="导演";return `<div class="pagehead"><div><div class="eyebrow">DIRECTOR'S NOTES</div><h2>导演公告</h2><p class="sub">重要通知集中发布，成员可以标记已读。</p></div>${director?'<button class="primary" onclick="editAnn()">＋ 发布公告</button>':""}</div><div class="grid two"><div class="card"><h3>公告列表</h3>${d.ann.length?d.ann.slice().reverse().map(a=>`<div class="item"><div class="row between"><h4>${esc(a.title)}</h4><span class="badge">${esc(a.priority)}</span></div><p>${esc(a.body)}</p><div class="row" style="margin-top:9px"><span class="muted">${esc(a.date)}</span><button onclick="ackAnn('${a.id}')">${(a.ack||[]).includes(d.user.name)?"已确认 ✓":"我已知晓"}</button>${director?`<button onclick="d.ann=d.ann.filter(x=>x.id!=='${a.id}');save();render()">删除</button>`:""}</div></div>`).join(""):'<div class="empty">暂无导演公告。</div>'}</div><div class="card"><h3>通知中心</h3><p class="sub">公告发布后会立即进入通知中心；成员进入工作台即可看到未确认提示并点击“我已知晓”。浏览器通知仅在已授权且页面运行的设备上显示。</p><div class="divider"></div><p class="sub">当前是 GitHub 静态网页版本，不同演员的手机/电脑之间还不能自动同步确认。若要跨设备第一时间推送并汇总全剧组确认，需要接入共享数据库与通知服务。</p></div></div>`}
function editAnn(){modal(`<h3>发布导演公告</h3><label>标题</label><input id="atitle"><label>重要程度</label><select id="apriority"><option>普通</option><option>重要</option><option>紧急</option></select><label>内容</label><textarea id="abody"></textarea><div class="modalactions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveAnn()">发布</button></div>`)}
function saveAnn(){if(!$("atitle").value.trim()||!$("abody").value.trim())return say("请填写标题和内容");d.ann.push({id:"a"+Date.now(),title:$("atitle").value,body:$("abody").value,priority:$("apriority").value,date:new Date().toLocaleDateString(),ack:[]});save();closeModal();render();say("公告已发布；成员进入工作台后可立即确认")}
function readAnn(id){if(!d.read.includes(id))d.read.push(id);save();render()}function ackAnn(id){let a=d.ann.find(x=>x.id===id);if(!a)return;a.ack=a.ack||[];if(!a.ack.includes(d.user.name))a.ack.push(d.user.name);if(!d.read.includes(id))d.read.push(id);save();render();say("已确认收到导演公告")}
function director(){return `<div class="pagehead"><div><div class="eyebrow">STAGE BLOCKING & LIGHTING</div><h2>导演模式</h2><p class="sub">拖动演员规划走位；切换“灯光设计”后，可添加并拖动光源，调整光圈大小与亮度。</p></div><div class="row"><button onclick="addActor()">＋ 添加演员</button><button class="primary" onclick="saveStage()">保存布局</button></div></div><div class="row" style="margin-bottom:13px"><select id="sceneSelect" style="max-width:280px" onchange="sceneIndex=+this.value;selectedLight=null;render()">${d.scenes.map((s,i)=>`<option value="${i}" ${i===sceneIndex?"selected":""}>${esc(s.name)}</option>`).join("")}</select><button onclick="newScene()">＋ 新场景</button><button onclick="renameScene()">重命名</button><button onclick="duplicateScene()">复制</button><button onclick="deleteScene()">删除</button><button onclick="routeMode=!routeMode;this.textContent=routeMode?'完成添加走位点':'添加走位点';say(routeMode?'点击舞台添加路线节点':'已退出走位点模式')">${routeMode?"完成添加走位点":"添加走位点"}</button><button onclick="clearRoute()">清空路线</button><button onclick="playRoute()">播放走位</button><button class="primary" onclick="addLight()">＋ 添加灯光</button></div><div class="stagegrid"><div class="stage" id="stage"><div class="curtain"></div><span class="stage-label" style="top:48px;left:12%">上场口</span><span class="stage-label" style="top:48px;right:12%">下场口</span><div class="floor"></div><span class="stage-label" style="bottom:3%;left:45%">观 众 席</span><svg id="routeSvg" class="routeSvg"></svg><div id="lights"></div><div id="actors"></div></div><div class="card"><h3>演员 / 角色</h3><p class="sub">先点“定位”选中演员，再拖动舞台上的人物圆点。路线点可点击删除。</p><div class="list">${d.people.map(p=>`<div class="item row"><span class="grow">${esc(p.name)}</span><button onclick="selected='${p.id}';drawStage()">定位</button></div>`).join("")}</div><div class="divider"></div><p class="sub" id="selInfo">尚未选择演员。</p><div class="row"><button onclick="moveActor(-3,0)">←</button><button onclick="moveActor(3,0)">→</button><button onclick="moveActor(0,-3)">↑</button><button onclick="moveActor(0,3)">↓</button></div><div class="divider"></div><h3>灯光设计</h3><p class="sub">光源可拖到演员身上。选中光源后，可调范围、亮度与颜色。</p><div id="lightInfo" class="light-controls"></div><p class="sub">保存时间：${esc(d.savedAt||"尚未保存")}</p><div class="row"><button onclick="exportStage()">导出布局 JSON</button><button onclick="importStage()">导入布局</button><input id="stageFile" class="hidden" type="file" accept=".json" onchange="readStage(this)"></div></div></div><p class="sub">灯光和走位布局保存在当前浏览器，并可导出 JSON；GitHub Pages 静态网页不会自动同步到其他设备。</p>`}

function sc(){if(!d.scenes.length)d.scenes=[{name:"场景一 · 北大红楼（Part 1）",actors:{},routes:{},lights:[]}];let x=d.scenes[Math.max(0,Math.min(sceneIndex,d.scenes.length-1))];x.actors=x.actors||{};x.routes=x.routes||{};x.lights=x.lights||[];return x}
function pos(id){return sc().actors[id]||{x:15+(d.people.findIndex(p=>p.id===id)%6)*13,y:24+Math.floor(d.people.findIndex(p=>p.id===id)/6)*18}}
function drawStage(){let root=$("actors");if(!root)return;root.innerHTML=d.people.map(p=>{let q=pos(p.id);return `<div class="actor ${selected===p.id?"selected":""}" data-id="${p.id}" style="left:${q.x}%;top:${q.y}%;background:${p.color||"#913941"}" onpointerdown="down(event,'${p.id}')" onclick="selected='${p.id}';drawStage()">${esc(p.name.slice(0,2))}<small>${esc(p.name)}</small></div>`}).join("");$("stage").onclick=e=>{if(!routeMode||e.target.closest(".actor")||e.target.closest(".light-area"))return;if(!selected)return say("先选择演员");let r=$("stage").getBoundingClientRect();sc().routes[selected]=sc().routes[selected]||[];sc().routes[selected].push({x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100});save();drawStage()};let svg=$("routeSvg"),route=sc().routes[selected]||[],q=selected?pos(selected):null,w=$("stage").clientWidth,h=$("stage").clientHeight;svg.setAttribute("viewBox",`0 0 ${w} ${h}`);let pts=q?[[q.x*w/100,q.y*h/100],...route.map(p=>[p.x*w/100,p.y*h/100])]:[];svg.innerHTML=pts.length>1?`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0]+","+p[1]).join(" ")}"/>`:"";route.forEach((p,i)=>{let el=document.createElement("button");el.textContent="";el.style.cssText=`position:absolute;z-index:4;width:13px;height:13px;padding:0;border-radius:50%;background:var(--gold);left:${p.x}%;top:${p.y}%;`;el.onclick=ev=>{ev.stopPropagation();route.splice(i,1);save();drawStage()};root.appendChild(el)});$("selInfo").textContent=selected?"已选择："+(d.people.find(p=>p.id===selected)?.name||"演员"):"尚未选择演员";drawLights();}
function down(e,id){selected=id;if(routeMode)return;drag=id;e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.onpointermove=ev=>{if(!drag)return;let r=$("stage").getBoundingClientRect();sc().actors[id]={x:Math.max(2,Math.min(94,(ev.clientX-r.left)/r.width*100)),y:Math.max(8,Math.min(82,(ev.clientY-r.top)/r.height*100))};let el=document.querySelector(`[data-id="${id}"]`);el.style.left=sc().actors[id].x+"%";el.style.top=sc().actors[id].y+"%"};e.currentTarget.onpointerup=()=>{drag=null;save();drawStage()}}
function addLight(){let a=sc().lights||(sc().lights=[]);let l={id:"light"+Date.now(),name:"范围光 "+(a.length+1),type:"范围光",x:50+(a.length%3-1)*12,y:35+Math.floor(a.length/3)*12,radius:25,alpha:.48,color:"#ffe7a0"};a.push(l);selectedLight=l.id;save();drawStage();say("已添加光源：拖动光圈可调整位置")}
function currentLight(){return sc().lights.find(l=>l.id===selectedLight)||null}
function drawLights(){let root=$("lights");if(!root)return;root.innerHTML=(sc().lights||[]).map(l=>`<div class="light-area ${l.type==="追光"?"type-spot":l.type==="侧光"?"type-side":l.type==="顶光"?"type-top":"type-area"} ${selectedLight===l.id?"selected":""}" data-light="${esc(l.id)}" style="left:${l.x}%;top:${l.y}%;width:${l.radius*2}%;--light-alpha:${l.alpha};background:radial-gradient(circle,${hexRgba(l.color,l.alpha)} 0%,${hexRgba(l.color,l.alpha*.55)} 28%,${hexRgba(l.color,l.alpha*.2)} 55%,${hexRgba(l.color,0)} 74%)" onpointerdown="lightDown(event,'${l.id}')" onclick="event.stopPropagation();selectedLight='${l.id}';renderLightPanel();drawLights()"><span class="light-bulb"></span><span class="light-label">${esc(l.name)}</span></div>`).join("");renderLightPanel()}
function hexRgba(hex,a){let h=String(hex||"#ffe7a0").replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");let n=parseInt(h,16);if(Number.isNaN(n))return `rgba(255,231,160,${a})`;return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,a))})`}
function renderLightPanel(){let el=$("lightInfo");if(!el)return;let l=currentLight();if(!l){el.innerHTML='<p class="sub">还没有选中光源。</p><button onclick="addLight()">＋ 添加第一个光源</button>';return}el.innerHTML=`<label>光源名称</label><input value="${esc(l.name)}" onchange="setLightProp('name',this.value)"><label>灯光类型</label><select onchange="setLightProp('type',this.value)"><option ${l.type==="范围光"?"selected":""}>范围光</option><option ${l.type==="追光"?"selected":""}>追光</option><option ${l.type==="面光"?"selected":""}>面光</option><option ${l.type==="侧光"?"selected":""}>侧光</option><option ${l.type==="顶光"?"selected":""}>顶光</option></select><label>光圈范围 <span id="radiusVal">${l.radius}</span>%</label><input type="range" min="8" max="45" value="${l.radius}" oninput="setLightProp('radius',+this.value,false);document.getElementById('radiusVal').textContent=this.value"><label>亮度 <span id="alphaVal">${Math.round(l.alpha*100)}</span>%</label><input type="range" min="10" max="85" value="${Math.round(l.alpha*100)}" oninput="setLightProp('alpha',+this.value/100,false);document.getElementById('alphaVal').textContent=this.value"><label>灯光颜色</label><input type="color" value="${esc(l.color||"#ffe7a0")}" onchange="setLightProp('color',this.value)"><div class="row" style="margin-top:12px"><button onclick="centerLightOnActor()">光源对准选中演员</button><button onclick="deleteLight()">删除光源</button></div>`}
function setLightProp(k,v,redraw=true){let l=currentLight();if(!l)return;l[k]=v;save();if(redraw)drawLights();else{let e=document.querySelector(`[data-light="${l.id}"]`);if(e){e.style.width=(l.radius*2)+"%";e.style.setProperty("--light-alpha",l.alpha);e.style.background=`radial-gradient(circle,${hexRgba(l.color,l.alpha)} 0%,${hexRgba(l.color,l.alpha*.55)} 28%,${hexRgba(l.color,l.alpha*.2)} 55%,${hexRgba(l.color,0)} 74%)`}}}
function lightDown(e,id){e.stopPropagation();selectedLight=id;drag="light:"+id;let el=e.currentTarget;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{if(drag!=="light:"+id)return;let r=$("stage").getBoundingClientRect(),l=sc().lights.find(x=>x.id===id);if(!l)return;l.x=Math.max(3,Math.min(97,(ev.clientX-r.left)/r.width*100));l.y=Math.max(8,Math.min(90,(ev.clientY-r.top)/r.height*100));el.style.left=l.x+"%";el.style.top=l.y+"%"};el.onpointerup=()=>{drag=null;save();drawLights()}}
function centerLightOnActor(){let l=currentLight();if(!l||!selected)return say("先选中一个光源和一个演员");let p=pos(selected);l.x=p.x;l.y=p.y;save();drawLights();say("光源已对准选中演员")}
function deleteLight(){let l=currentLight();if(!l)return;sc().lights=sc().lights.filter(x=>x.id!==l.id);selectedLight=null;save();drawLights();say("光源已删除")}
function moveActor(dx,dy){if(!selected)return say("先选择演员");let p=pos(selected);sc().actors[selected]={x:Math.max(2,Math.min(94,p.x+dx)),y:Math.max(8,Math.min(82,p.y+dy))};save();drawStage()}
function addActor(){let n=prompt("输入角色名");if(n?.trim()){d.people.push({id:"p"+Date.now(),name:n.trim(),assignee:"",confirmed:false,color:"#a9474c"});save();render()}}
function newScene(){let n=prompt("新场景名称","场景 "+(d.scenes.length+1));if(n){d.scenes.push({name:n,actors:{},routes:{},lights:[]});sceneIndex=d.scenes.length-1;save();render()}}
function renameScene(){let n=prompt("场景名称",sc().name);if(n){sc().name=n;save();render()}}
function duplicateScene(){d.scenes.push(JSON.parse(JSON.stringify({...sc(),name:sc().name+"（副本）",lights:sc().lights||[]})));sceneIndex=d.scenes.length-1;save();render()}
function deleteScene(){if(d.scenes.length<2)return say("至少保留一个场景");if(confirm("删除当前场景？")){d.scenes.splice(sceneIndex,1);sceneIndex=Math.max(0,sceneIndex-1);save();render()}}
function clearRoute(){if(!selected)return say("先选择演员");sc().routes[selected]=[];save();drawStage()}
function saveStage(){d.savedAt=new Date().toLocaleString();save();render();say("舞台布局已保存")}
function playRoute(){if(!selected)return say("先选择演员");let r=sc().routes[selected]||[];if(!r.length)return say("请先添加走位点");let i=0;function step(){if(i>=r.length)return;sc().actors[selected]={...r[i++]};drawStage();setTimeout(step,650)}step()}
function exportStage(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({people:d.people,scenes:d.scenes},null,2)],{type:"application/json"}));a.download="五四运动学生剧_舞台布局.json";a.click();URL.revokeObjectURL(a.href)}
function importStage(){$("stageFile").click()}function readStage(i){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.people)d.people=x.people;if(x.scenes)d.scenes=x.scenes;save();render();say("布局已导入")}catch(e){say("文件格式不正确")}};if(i.files[0])r.readAsText(i.files[0])}
function modal(s){$("modal").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}function closeModal(){$("modal").innerHTML=""}
if(d.user){$("name").value=d.user.name;$("role").value=d.user.role;$("character").value=d.user.character||"";enter()}
</script></body></html>
